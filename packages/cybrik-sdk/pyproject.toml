[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cybrik-sdk"
version = "0.1.0"
description = "CYBRIK Unified Python Client SDK & Developer CLI Utility"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "typer>=0.9.0",
]

[project.scripts]
cybrik = "cybrik_sdk.cli:app"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "mypy>=1.9.0",
    "ruff>=0.4.0",
    # Used by tests/test_contract_conformance.py to validate the SDK's mock
    # payloads against contracts/json-schema/. Declared explicitly: both were
    # already resolvable in the dev venv but undeclared, which is
    # accidentally-working rather than a dependency.
    "jsonschema>=4.26.0",
    "referencing>=0.37.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/cybrik_sdk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-p no:cacheprovider"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
