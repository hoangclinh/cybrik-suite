# Contract standards validation + secret scan for the CYBRIK Suite meta/control repository.
#
# Status: static contract conformance for a mixed lifecycle corpus: accepted W1 contract lines,
# accepted-for-implementation Wave 2 packets and remaining proposals. A green run proves only
# static schema/semantic conformance. It is not runtime, deployment, release or acceptance proof.
#
# Two independent jobs, least-privilege (read-only) token:
#   secret-scan  — gitleaks 8.30.1 (pinned + checksum-verified), full-tree AND full-history.
#   contracts    — official validators (ajv 2020-12, Spectral `oas`, @asyncapi/parser) via a
#                  reproducible `npm ci` from the committed lockfile.
# GitHub-owned actions are pinned by commit SHA (supply-chain hardening).

name: contracts

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: contracts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: secret-scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history for git-mode scan)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (Node 24 action runtime)
        with:
          fetch-depth: 0

      - name: Install gitleaks 8.30.1 (pinned, checksum-verified)
        run: |
          set -euo pipefail
          VER=8.30.1
          SHA=551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${VER}/gitleaks_${VER}_linux_x64.tar.gz" -o gitleaks.tar.gz
          echo "${SHA}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks version

      # Working tree (node_modules is absent — no deps installed in this job). Strictest mode;
      # exercises the two narrow allowlists: generic-api-key fixtures and one exact F8 TEST JWT.
      - name: Secret scan — working tree
        run: ./gitleaks dir . --config .gitleaks.toml --no-banner --redact --exit-code 1

      - name: Secret scan — full git history
        run: ./gitleaks git . --config .gitleaks.toml --no-banner --redact --exit-code 1

  contracts:
    name: contract standards validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout contract topology
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (Node 24 action runtime)
        with:
          fetch-depth: 0

      - name: Setup Node.js 24.18.1
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0 (Node 24 action runtime)
        with:
          node-version: "24.18.1"
          cache: npm
          cache-dependency-path: tools/contract-validation/package-lock.json

      # ci = exact, reproducible install from the committed lockfile. .npmrc pins
      # ignore-scripts=true (no dependency lifecycle code runs at install time).
      - name: Install validators (reproducible, no lifecycle scripts)
        working-directory: tools/contract-validation
        run: npm ci

      - name: Audit validator dependencies (high severity gate)
        working-directory: tools/contract-validation
        run: npm audit --audit-level=high

      - name: Validate contract packet (JSON Schema 2020-12 + OpenAPI 3.1.x + AsyncAPI 3.0.0 + hardenings)
        working-directory: tools/contract-validation
        run: npm run validate

      - name: Test accepted W1 static contract lines (exactly 98 tests)
        working-directory: tools/contract-validation
        run: npm run test:w1-contracts

      - name: Test W1 control validator fail-closed rules
        working-directory: tools/contract-validation
        run: npm run test:w1-control

  topology-rehearsal-tests:
    name: topology rehearsal tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout topology rehearsal suite
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (Node 24 action runtime)

      # No new GitHub Action enters the reviewed supply chain here. uv is already a
      # project dependency, so installing it from PyPI at a pinned version in a run:
      # step adds no supplier the trusted set does not already carry. 0.11.16 is the
      # version the local collector measures with.
      - name: Install uv 0.11.16 (pinned, from PyPI — deliberately not an action)
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --no-input "uv==0.11.16"
          uv --version

      # Install may reach the network; measurement may not. --frozen never rewrites
      # the committed uv.lock, and the three measuring steps below add --offline so
      # no measured command can resolve anything the lockfile did not already pin.
      - name: Materialise the locked environment (--frozen never regenerates uv.lock)
        working-directory: integration/topology-rehearsal
        run: uv sync --frozen --group test

      - name: Measure pytest, ruff and compileall (no network)
        working-directory: integration/topology-rehearsal
        run: |
          set -euo pipefail
          uv run --frozen --offline --group test python -m pytest -q \
            --junit-xml="${RUNNER_TEMP}/pytest.xml" || true
          uv run --frozen --offline ruff check --no-cache \
            --output-format=json src tests > "${RUNNER_TEMP}/ruff.json" || true
          uv run --frozen --offline python -m compileall -q src tests

      # The bar is read from .github/REVIEW-BASELINE.json and is never written here.
      # That file lives outside this lane's write prefix on purpose: a lane that can
      # edit its own baseline is setting its own gate. A drift in EITHER direction
      # fails — an over-run is a regression, and an under-run means a RED was retired
      # without the baseline owner lowering the number and recording why.
      - name: Compare against the declared baseline (fail-closed both directions)
        working-directory: integration/topology-rehearsal
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, sys, xml.etree.ElementTree as ET

          root = os.environ["GITHUB_WORKSPACE"]
          tmp = os.environ["RUNNER_TEMP"]
          with open(os.path.join(root, ".github", "REVIEW-BASELINE.json")) as handle:
              baseline = json.load(handle)

          suite = ET.parse(os.path.join(tmp, "pytest.xml")).getroot()
          if suite.tag == "testsuites":
              suite = suite.find("testsuite")
          measured_failures = int(suite.get("failures", 0)) + int(suite.get("errors", 0))
          declared_failures = baseline["pytest"]["expected_failures"]

          with open(os.path.join(tmp, "ruff.json")) as handle:
              measured_violations = len(json.load(handle))
          declared_violations = baseline["ruff"]["expected_violations"]

          problems = []
          for label, measured, declared in (
              ("pytest failures", measured_failures, declared_failures),
              ("ruff violations", measured_violations, declared_violations),
          ):
              if measured > declared:
                  problems.append(
                      f"{label}: measured {measured} exceeds the declared {declared} — "
                      "a regression against the bar."
                  )
              elif measured < declared:
                  problems.append(
                      f"{label}: measured {measured} is below the declared {declared}. "
                      "If a RED was legitimately retired, the owner of "
                      ".github/REVIEW-BASELINE.json lowers the number and records why "
                      "in revision_history; this job may not."
                  )

          print(
              f"pytest failures {measured_failures}/{declared_failures}; "
              f"ruff violations {measured_violations}/{declared_violations}"
          )
          if problems:
              for problem in problems:
                  print(f"::error::{problem}")
              sys.exit(1)
          PY
