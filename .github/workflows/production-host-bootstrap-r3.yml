name: Production Host Bootstrap R3.2 Qualification

on:
  workflow_dispatch:
  push:
    branches:
      - ai-infra/bootstrap-r3-github-qualification
      - main

permissions:
  contents: read

jobs:
  static-contract:
    name: R3.2 / static-contract
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install ShellCheck and jq
        run: sudo apt-get update && sudo apt-get install -y shellcheck jq

      - name: Run ShellCheck on Bootstrap Script
        run: |
          shellcheck plans/bootstrap-production-host-R3.sh

      - name: Validate JSON Baseline Contracts
        run: |
          jq . plans/PRODUCTION_HOST_HARDENING_BASELINE-R3.json
          jq . plans/R3_GITHUB_WORKFLOW_OWNERSHIP.json

      - name: Verify Contract / Script Consistency
        run: |
          grep -q 'PermitRootLogin no' plans/bootstrap-production-host-R3.sh
          grep -q 'PermitRootLogin' plans/PRODUCTION_HOST_HARDENING_BASELINE-R3.json
          grep -q 'Cmnd_Alias CYBRIK_INFRA' plans/bootstrap-production-host-R3.sh
          grep -q -- '--get-challenge-nonce' plans/bootstrap-production-host-R3.sh
          grep -q -- '--record-operator-proof' plans/bootstrap-production-host-R3.sh
          grep -q 'STAGE1_HEALTH_MARKER' plans/bootstrap-production-host-R3.sh

  bootstrap-happy-path:
    name: R3.2 / bootstrap-happy-${{ matrix.qualification_run }}
    runs-on: ubuntu-24.04
    needs: static-contract
    strategy:
      fail-fast: false
      matrix:
        qualification_run: [1, 2, 3]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Create Evidence Directory
        run: |
          mkdir -p evidence_output

      - name: Generate Ephemeral Qualification SSH Key Pair
        run: |
          ssh-keygen -t ed25519 -N '' -f /tmp/ci_test_key -C 'ci-qualification-key-${{ matrix.qualification_run }}'
          chmod 0600 /tmp/ci_test_key
          ssh-keygen -l -f /tmp/ci_test_key.pub > evidence_output/ssh_key_fingerprint.txt
          echo 'Generated ephemeral CI qualification key.'

      - name: 'RUN 1: Test Root SSH Pre-Lockdown Baseline'
        run: |
          sudo mkdir -p /root/.ssh
          sudo cp /tmp/ci_test_key.pub /root/.ssh/authorized_keys
          sudo chmod 0700 /root/.ssh
          sudo chmod 0600 /root/.ssh/authorized_keys
          sudo systemctl restart ssh || sudo systemctl restart sshd
          sleep 2
          ROOT_LOGIN=$(ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -i /tmp/ci_test_key root@127.0.0.1 whoami)
          echo "Pre-lockdown root login: ${ROOT_LOGIN}"
          if [[ "${ROOT_LOGIN}" != "root" ]]; then
            echo '[-] ERROR: Root login pre-lockdown baseline failed!' >&2
            exit 1
          fi
          echo 'ROOT_SSH_PRE_LOCKDOWN: PASS' > evidence_output/root_ssh_pre_lockdown.txt

      - name: 'RUN 1: Execute Bootstrap Stage 1'
        run: |
          sudo mkdir -p /opt/cybrik/bin
          sudo cp plans/bootstrap-production-host-R3.sh /opt/cybrik/bin/bootstrap-production-host-R3.sh
          sudo chmod 0755 /opt/cybrik/bin/bootstrap-production-host-R3.sh
          sudo bash /opt/cybrik/bin/bootstrap-production-host-R3.sh --stage1 --authorized-key-file /tmp/ci_test_key.pub 2>&1 | tee evidence_output/run1_stage1.log
          sudo test -f /opt/cybrik/.bootstrap_stage1_healthy

      - name: 'RUN 1: Test Stage 2 Rejection Without Operator Proof'
        run: |
          echo '==> Testing Stage 2 invocation before operator proof...'
          if sudo bash /opt/cybrik/bin/bootstrap-production-host-R3.sh --stage2 2> evidence_output/premature_stage2.err; then
            echo '[-] ERROR: Stage 2 succeeded without operator proof!' >&2
            exit 1
          else
            echo '[+] Stage 2 correctly failed because operator proof was absent.'
            echo 'STAGE2_WITHOUT_PROOF: DENIED' > evidence_output/stage2_without_proof_denied.txt
          fi

      - name: 'RUN 1: Retrieve Challenge Nonce & Record Machine-Enforced Operator Proof'
        run: |
          sleep 2
          CHALLENGE_NONCE=$(sudo bash /opt/cybrik/bin/bootstrap-production-host-R3.sh --get-challenge-nonce)
          echo "Retrieved challenge nonce: ${CHALLENGE_NONCE}"
          ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -i /tmp/ci_test_key cybrik-admin@127.0.0.1 \
            "sudo /opt/cybrik/bin/bootstrap-production-host-R3.sh --record-operator-proof --challenge-nonce ${CHALLENGE_NONCE}"
          sudo test -f /opt/cybrik/.operator_ssh_proof
          sudo test ! -f /opt/cybrik/.operator_ssh_challenge
          sudo cat /opt/cybrik/.operator_ssh_proof > evidence_output/operator_ssh_proof.json

      - name: 'RUN 1: Execute Bootstrap Stage 2 (SSH Lockdown)'
        run: |
          sudo bash /opt/cybrik/bin/bootstrap-production-host-R3.sh --stage2 2>&1 | tee evidence_output/run1_stage2.log

      - name: 'RUN 1: Test Real Post-Lockdown Operator Login & Root Denial'
        run: |
          sleep 2
          OP_USER_POST=$(ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -i /tmp/ci_test_key cybrik-admin@127.0.0.1 whoami)
          echo "Post-lockdown operator login: ${OP_USER_POST}"
          test "${OP_USER_POST}" == "cybrik-admin"

          if ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=3 -i /tmp/ci_test_key root@127.0.0.1 true 2>/dev/null; then
            echo '[-] ERROR: Root SSH login succeeded post-lockdown when it must be denied!' >&2
            exit 1
          else
            echo '[+] Root SSH login was successfully denied post-lockdown.'
            echo 'ROOT_SSH_LOGIN: DENIED' > evidence_output/run1_root_denial.txt
          fi

          sudo sshd -T | grep -E 'permitrootlogin|passwordauthentication|pubkeyauthentication|kbdinteractiveauthentication|maxauthtries' > evidence_output/sshd_effective_config.txt

      - name: 'RUN 1: Execute Post-Bootstrap Verification'
        run: |
          sudo bash /opt/cybrik/bin/bootstrap-production-host-R3.sh --verify 2>&1 | tee evidence_output/run1_verify.log

      - name: 'RUN 2 (Idempotency): Repeat Complete Bootstrap Sequence on Same Host'
        run: |
          echo '==> Run 2: Re-running Stage 1...'
          sudo bash /opt/cybrik/bin/bootstrap-production-host-R3.sh --stage1 --authorized-key-file /tmp/ci_test_key.pub 2>&1 | tee evidence_output/run2_stage1.log

          echo '==> Run 2: Retrieving fresh challenge nonce & recording operator proof via SSH...'
          NONCE_RUN2=$(sudo bash /opt/cybrik/bin/bootstrap-production-host-R3.sh --get-challenge-nonce)
          ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -i /tmp/ci_test_key cybrik-admin@127.0.0.1 \
            "sudo /opt/cybrik/bin/bootstrap-production-host-R3.sh --record-operator-proof --challenge-nonce ${NONCE_RUN2}"

          echo '==> Run 2: Re-running Stage 2...'
          sudo bash /opt/cybrik/bin/bootstrap-production-host-R3.sh --stage2 2>&1 | tee evidence_output/run2_stage2.log

          echo '==> Run 2: Re-running Post-Bootstrap Verification...'
          sudo bash /opt/cybrik/bin/bootstrap-production-host-R3.sh --verify 2>&1 | tee evidence_output/run2_verify.log

      - name: Test Real Docker / UFW Bypass Protection with Actual TCP Listeners
        run: |
          docker run -d --name cybrik_real_listeners \
            -v $(pwd)/plans/multi_port_listener.py:/app/server.py \
            -p 5432:5432 -p 6379:6379 -p 8000:8000 -p 8600:8600 -p 9000:9000 -p 8080:8080 \
            python:3-alpine python /app/server.py

          sleep 3
          docker port cybrik_real_listeners > evidence_output/docker_published_ports.txt

          sudo ip netns add testns || true
          sudo ip link add veth_test0 type veth peer name veth_test1 || true
          sudo ip link set veth_test1 netns testns
          sudo ip addr add 192.168.211.1/24 dev veth_test0 || true
          sudo ip link set veth_test0 up
          sudo ip netns exec testns ip addr add 192.168.211.2/24 dev veth_test1
          sudo ip netns exec testns ip link set veth_test1 up
          sudo ip netns exec testns ip route add default via 192.168.211.1

          echo '==> Testing Phase 1: Pre-Block reachability through Docker NAT...'
          sudo iptables -F DOCKER-USER
          for port in 5432 6379 8000 8600 9000; do
            if sudo ip netns exec testns nc -z -w 2 192.168.211.1 $port; then
              echo "[+] Port $port is REACHABLE pre-block (Docker NAT bypass reproduced)."
            else
              echo "[-] ERROR: Port $port listener failed pre-block reachability check!" >&2
              exit 1
            fi
          done
          echo 'PRE_BLOCK_REACHABILITY: PROVEN_FOR_ALL_FORBIDDEN_PORTS' > evidence_output/pre_block_reachability.txt

          echo '==> Testing Phase 2: Post-Block mitigation via DOCKER-USER rule...'
          sudo iptables -I DOCKER-USER 1 -p tcp -m multiport --dports 5432,6379,8000,8600,9000 -j DROP
          for port in 5432 6379 8000 8600 9000; do
            if sudo ip netns exec testns nc -z -w 1 192.168.211.1 $port 2>/dev/null; then
              echo "[-] ERROR: Forbidden port $port was reachable after DOCKER-USER drop rule!" >&2
              exit 1
            else
              echo "[+] Forbidden port $port is successfully DENIED/DROPPED post-block."
            fi
          done
          echo 'POST_BLOCK_DENIAL: PROVEN_FOR_ALL_FORBIDDEN_PORTS' > evidence_output/post_block_denial.txt

          echo '==> Testing Phase 3: Allowed port 8080 reachability...'
          if sudo ip netns exec testns nc -z -w 2 192.168.211.1 8080; then
            echo '[+] Allowed port 8080 is REACHABLE (Firewall policy is selective).'
            echo 'ALLOWED_PORT_PATH_NOT_BROKEN: YES' > evidence_output/allowed_port_reachable.txt
          else
            echo '[-] ERROR: Allowed port 8080 was blocked!' >&2
            exit 1
          fi

          docker rm -f cybrik_real_listeners
          sudo ip netns del testns || true
          sudo ip link del veth_test0 2>/dev/null || true

      - name: Verify Zero Application Side Effects
        run: |
          RUNNING_CYBRIK=$(docker ps --filter 'name=cybrik-soc-' --format '{{.Names}}')
          if [[ -n "${RUNNING_CYBRIK}" ]]; then
            echo "[-] ERROR: Application containers running unexpectedly: ${RUNNING_CYBRIK}" >&2
            exit 1
          fi
          echo 'ZERO_APPLICATION_SIDE_EFFECTS: CONFIRMED' > evidence_output/zero_app_side_effects.txt

      - name: Collect Comprehensive Effective System State Receipts
        run: |
          uname -a > evidence_output/kernel_info.txt
          cat /etc/os-release > evidence_output/os_release.txt
          docker version > evidence_output/docker_version.txt
          docker info > evidence_output/docker_info.txt
          cat /etc/docker/daemon.json > evidence_output/docker_daemon_config.txt
          sudo ufw status verbose > evidence_output/ufw_status.txt
          sudo iptables -S DOCKER-USER > evidence_output/iptables_docker_user.txt || true
          sudo iptables-save > evidence_output/iptables_save.txt || true
          sudo nft list ruleset > evidence_output/nft_ruleset.txt 2>/dev/null || true
          sudo chmod 0440 /etc/sudoers.d/* 2>/dev/null || sudo chmod 0440 /etc/sudoers.d/99-cybrik-admin
          sudo visudo -cf /etc/sudoers.d/99-cybrik-admin > evidence_output/sudoers_check.txt
          sudo visudo -c > evidence_output/visudo_global_check.txt || true
          systemctl is-active chrony > evidence_output/chrony_status.txt
          chronyc tracking > evidence_output/chrony_tracking.txt || true
          systemctl is-active docker > evidence_output/docker_status.txt
          systemctl is-active fail2ban > evidence_output/fail2ban_status.txt
          sudo fail2ban-client status sshd > evidence_output/fail2ban_sshd_status.txt || true
          ss -lntup > evidence_output/listening_sockets.txt

      - name: Hash Evidence Receipts & Securely Wipe Private Key
        run: |
          sudo rm -f /root/.ssh/authorized_keys
          shred -u /tmp/ci_test_key || rm -f /tmp/ci_test_key
          rm -f /tmp/ci_test_key.pub
          cd evidence_output
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - name: Upload Safe Evidence Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bootstrap-r3.2-happy-run-${{ matrix.qualification_run }}
          path: evidence_output/
          if-no-files-found: error

  failure-injection:
    name: R3.2 / failure-injection
    runs-on: ubuntu-24.04
    needs: static-contract
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Create Failure Evidence Directory
        run: |
          mkdir -p failure_evidence
          sudo mkdir -p /opt/cybrik/bin
          sudo cp plans/bootstrap-production-host-R3.sh /opt/cybrik/bin/bootstrap-production-host-R3.sh
          sudo chmod 0755 /opt/cybrik/bin/bootstrap-production-host-R3.sh

      - name: 'F1: Missing Authorized Key Rejection'
        run: |
          sudo rm -f /opt/cybrik/.bootstrap* /opt/cybrik/.operator*
          if sudo bash plans/bootstrap-production-host-R3.sh --stage1 2> failure_evidence/f1_missing_key.log; then
            echo '[-] ERROR: Stage 1 succeeded without authorized key file!' >&2
            exit 1
          else
            echo '[+] F1: Missing key file was correctly rejected.'
          fi

      - name: 'F2: Invalid Key Format Rejection'
        run: |
          sudo rm -f /opt/cybrik/.bootstrap* /opt/cybrik/.operator*
          echo 'THIS_IS_NOT_AN_SSH_KEY' > /tmp/invalid_key.pub
          if sudo bash plans/bootstrap-production-host-R3.sh --stage1 --authorized-key-file /tmp/invalid_key.pub 2> failure_evidence/f2_invalid_key.log; then
            echo '[-] ERROR: Stage 1 succeeded with invalid key format!' >&2
            exit 1
          else
            echo '[+] F2: Invalid key format was correctly rejected.'
          fi
          rm -f /tmp/invalid_key.pub

      - name: 'F3: Stage 2 Precondition Guard (Missing Stage 1 Marker)'
        run: |
          sudo rm -f /opt/cybrik/.bootstrap_stage1_complete /opt/cybrik/.bootstrap_stage1_healthy /opt/cybrik/.operator*
          if sudo bash plans/bootstrap-production-host-R3.sh --stage2 2> failure_evidence/f3_missing_stage1.log; then
            echo '[-] ERROR: Stage 2 succeeded without Stage 1!' >&2
            exit 1
          else
            echo '[+] F3: Stage 2 correctly refused to run without Stage 1.'
          fi

      - name: 'F4: Transactional Sudoers Failure Injection'
        run: |
          sudo rm -f /opt/cybrik/.bootstrap* /opt/cybrik/.operator* /etc/sudoers.d/99-cybrik-admin
          ssh-keygen -t ed25519 -N '' -f /tmp/f4_key
          if sudo CYBRIK_BOOTSTRAP_TEST_MODE=1 CYBRIK_INJECT_FAIL_SUDOERS=1 bash plans/bootstrap-production-host-R3.sh --stage1 --authorized-key-file /tmp/f4_key.pub 2> failure_evidence/f4_bad_sudoers.log; then
            echo '[-] ERROR: Stage 1 succeeded with bad sudoers!' >&2
            exit 1
          else
            echo '[+] F4: Sudoers injection correctly aborted Stage 1.'
            sudo test ! -f /etc/sudoers.d/99-cybrik-admin
          fi
          rm -f /tmp/f4_key*

      - name: 'F5: Transactional SSHD Candidate Failure Injection'
        run: |
          sudo rm -f /opt/cybrik/.bootstrap* /opt/cybrik/.operator*
          ssh-keygen -t ed25519 -N '' -f /tmp/f5_key
          sudo bash plans/bootstrap-production-host-R3.sh --stage1 --authorized-key-file /tmp/f5_key.pub
          NONCE_F5=$(sudo bash plans/bootstrap-production-host-R3.sh --get-challenge-nonce)
          ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -i /tmp/f5_key cybrik-admin@127.0.0.1 \
            "sudo /opt/cybrik/bin/bootstrap-production-host-R3.sh --record-operator-proof --challenge-nonce ${NONCE_F5}"
          if sudo CYBRIK_BOOTSTRAP_TEST_MODE=1 CYBRIK_INJECT_FAIL_SSHD=1 bash plans/bootstrap-production-host-R3.sh --stage2 2> failure_evidence/f5_bad_sshd.log; then
            echo '[-] ERROR: Stage 2 succeeded with bad sshd config!' >&2
            exit 1
          else
            echo '[+] F5: Bad SSHD candidate was correctly rejected by sshd -t.'
            sudo test ! -f /etc/ssh/sshd_config.d/01-cybrik-hardening.conf
          fi
          rm -f /tmp/f5_key*

      - name: 'F6: Transactional Docker Repo Retrieval Failure Injection'
        run: |
          sudo rm -f /opt/cybrik/.bootstrap* /opt/cybrik/.operator*
          ssh-keygen -t ed25519 -N '' -f /tmp/f6_key
          if sudo CYBRIK_BOOTSTRAP_TEST_MODE=1 CYBRIK_INJECT_FAIL_REPO=1 bash plans/bootstrap-production-host-R3.sh --stage1 --authorized-key-file /tmp/f6_key.pub 2> failure_evidence/f6_bad_repo.log; then
            echo '[-] ERROR: Stage 1 succeeded despite repo failure!' >&2
            exit 1
          else
            echo '[+] F6: Repo retrieval failure correctly aborted Stage 1.'
            sudo test ! -f /opt/cybrik/.bootstrap_stage1_healthy
          fi
          rm -f /tmp/f6_key*

      - name: 'F7: Transactional Docker Daemon JSON Failure Injection'
        run: |
          sudo rm -f /opt/cybrik/.bootstrap* /opt/cybrik/.operator*
          ssh-keygen -t ed25519 -N '' -f /tmp/f7_key
          if sudo CYBRIK_BOOTSTRAP_TEST_MODE=1 CYBRIK_INJECT_FAIL_DOCKER_DAEMON=1 bash plans/bootstrap-production-host-R3.sh --stage1 --authorized-key-file /tmp/f7_key.pub 2> failure_evidence/f7_bad_daemon.log; then
            echo '[-] ERROR: Stage 1 succeeded with bad daemon JSON!' >&2
            exit 1
          else
            echo '[+] F7: Invalid Docker daemon JSON correctly aborted Stage 1.'
            sudo test ! -f /opt/cybrik/.bootstrap_stage1_healthy
          fi
          rm -f /tmp/f7_key*

      - name: 'F8: Transactional Firewall Failure Injection'
        run: |
          sudo rm -f /opt/cybrik/.bootstrap* /opt/cybrik/.operator*
          ssh-keygen -t ed25519 -N '' -f /tmp/f8_key
          if sudo CYBRIK_BOOTSTRAP_TEST_MODE=1 CYBRIK_INJECT_FAIL_FIREWALL=1 bash plans/bootstrap-production-host-R3.sh --stage1 --authorized-key-file /tmp/f8_key.pub 2> failure_evidence/f8_bad_firewall.log; then
            echo '[-] ERROR: Stage 1 succeeded with firewall failure!' >&2
            exit 1
          else
            echo '[+] F8: Firewall failure correctly aborted Stage 1.'
            sudo test ! -f /opt/cybrik/.bootstrap_stage1_healthy
          fi
          rm -f /tmp/f8_key*

      - name: 'F9: Operator Proof Adversarial Invocations'
        run: |
          sudo rm -f /opt/cybrik/.bootstrap* /opt/cybrik/.operator*
          ssh-keygen -t ed25519 -N '' -f /tmp/f9_key
          sudo bash plans/bootstrap-production-host-R3.sh --stage1 --authorized-key-file /tmp/f9_key.pub
          NONCE_F9=$(sudo bash plans/bootstrap-production-host-R3.sh --get-challenge-nonce)

          if sudo /opt/cybrik/bin/bootstrap-production-host-R3.sh --record-operator-proof --challenge-nonce "${NONCE_F9}" 2> failure_evidence/f9_1_root_direct.log; then
            echo '[-] ERROR: Root direct proof recording succeeded!' >&2
            exit 1
          else
            echo '[+] F9.1: Root direct invocation was correctly denied.'
          fi

          if sudo -u cybrik-admin sudo /opt/cybrik/bin/bootstrap-production-host-R3.sh --record-operator-proof --challenge-nonce "${NONCE_F9}" 2> failure_evidence/f9_2_no_ssh.log; then
            echo '[-] ERROR: Local non-SSH proof recording succeeded!' >&2
            exit 1
          else
            echo '[+] F9.2: Local non-SSH invocation was correctly denied.'
          fi

          if ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -i /tmp/f9_key cybrik-admin@127.0.0.1 \
            "sudo /opt/cybrik/bin/bootstrap-production-host-R3.sh --record-operator-proof --challenge-nonce WRONG_NONCE_VALUE" 2> failure_evidence/f9_3_wrong_nonce.log; then
            echo '[-] ERROR: Wrong nonce proof recording succeeded!' >&2
            exit 1
          else
            echo '[+] F9.3: Wrong challenge nonce was correctly denied.'
          fi

          rm -f /tmp/f9_key*

      - name: Hash Failure Evidence Receipts
        run: |
          cd failure_evidence
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - name: Upload Failure Injection Artifact
        uses: actions/upload-artifact@v4
        with:
          name: bootstrap-r3.2-failure-injection
          path: failure_evidence/
          if-no-files-found: error
