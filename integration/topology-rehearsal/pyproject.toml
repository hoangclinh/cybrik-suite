# Status: BOUNDED C8 LIBRARY CORE PARTIALLY PRESENT — LATER C8 MODULES RED — NO RUNTIME AUTHORITY.
#
# This project holds the executable specification and part of the bounded C8 library core of
# the topology-only rehearsal runner described by
# docs/uat/topology-rehearsals/postgres-loopback-internal-v1-r1/G-U2B-POSTGRES-RUNTIME-TOPOLOGY-DIAGNOSIS-R1.md
# sections 7 and 8. Constants, errors, protocols, plan, adapters and observation are present;
# grant, preparation, admission, runner and scripts remain intentionally RED and absent.
# Nothing here authorizes a Docker effect, a listener, a PostgreSQL RED attempt, UAT, demo,
# merge, release or production action.

[project]
name = "cybrik-suite-topology-rehearsal"
version = "0.0.0"
description = "Injection-only partial C8 library core and RED specification for the remaining bounded topology rehearsal runner."
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
test = [
    "pytest==9.1.1",
]

[tool.ruff]
target-version = "py312"

[tool.pytest.ini_options]
addopts = "-p no:cacheprovider"
testpaths = ["tests"]
