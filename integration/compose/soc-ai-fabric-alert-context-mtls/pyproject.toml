[project]
name = "cybrik-suite-uat-soc-ai-fabric"
version = "0.0.0"
description = "Inert admission and local mTLS helpers for the integrated UAT harness."
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.13,<2",
    "asyncpg>=0.29,<1",
    "cryptography>=48.0.1,<51",
    "fastapi>=0.115,<1",
    "greenlet>=3,<4",
    "h11>=0.16,<1",
    "h2>=4.3,<5",
    "hpack>=4.1,<5",
    "httpx>=0.27,<1",
    "jsonschema==4.26.0",
    "priority>=2,<3",
    "pydantic>=2.7,<3",
    "sqlalchemy>=2.0.30,<3",
    "wsproto>=1.2,<2",
]

[dependency-groups]
test = [
    "coverage==7.15.2",
    "pytest==9.1.1",
    "pytest-asyncio>=1.4,<2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["cybrik_suite_uat_fabric"]

[tool.coverage.report]
fail_under = 80
show_missing = true

[tool.uv]
package = false
