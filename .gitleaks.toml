# gitleaks configuration for the CYBRIK Suite meta/control repository.
# Purpose: secret scanning in CI (see .github/workflows/contracts.yml). Pinned gitleaks 8.30.1.
#
# We use the full upstream default ruleset (useDefault = true) unchanged, then add TWO
# narrowly-scoped allowlists for two independently reviewed false-positive classes.
#
# Why the allowlist is safe:
#   - The files under contracts/examples/ are synthetic, curated CONFORMANCE fixtures — the
#     positive/negative test vectors the contract validators run against. Their identifier
#     fields (e.g. "idempotency_key": "idem-8f2c1a90-...") are deliberately constructed, non-
#     secret values. gitleaks' entropy-based `generic-api-key` heuristic matches them because
#     the JSON key contains the substring "key".
#   - The first allowlist is scoped by `targetRules = ["generic-api-key"]`, so ONLY that one
#     heuristic is relaxed for example JSON. Every high-signal rule (AWS/GCP/Azure keys, private
#     keys, JWTs, provider tokens, etc.) still scans examples except the single exact F8 TEST-ONLY
#     JWT vector described below. A different JWT or any real credential still fails CI.
#   - The repository data-handling boundary (CLAUDE.md) independently forbids committing real
#     secrets or customer data anywhere in the suite; this allowlist does not widen that.

title = "CYBRIK Suite secret-scan config"

[extend]
useDefault = true

[[allowlists]]
description = "Synthetic non-secret identifiers in contract conformance fixtures (generic-api-key heuristic only)."
targetRules = ["generic-api-key"]
paths = ['''contracts/examples/.*\.json$''']

# The F8 positive receipt fixture carries one deterministic TEST-ONLY compact JWS. It is
# intentionally public and reproducible from the seed label in the test suite, so it is not a
# credential. The upstream `jwt` rule correctly recognizes the compact serialization but cannot
# distinguish this frozen conformance vector from an operational token.
#
# This exception is an AND, not an OR: the rule id, exact positive-fixture path, and unique
# Ed25519 signature segment must all match. A different path, a different JWS in this path, or any
# other secret rule still fails closed. Negative fixtures remain source-escaped and are not
# allowlisted.
[[allowlists]]
description = "F8 TEST-ONLY positive receipt JWS vector (exact path and signature)"
targetRules = ["jwt"]
condition = "AND"
regexTarget = "line"
paths = ['''^contracts/examples/receipt-integrity/positive/receipt-signature-envelope\.json$''']
regexes = ['''^\s*"jws_compact": "[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.IB9ZgpRgf0WNvMHwPnLc3nQJskAWiTG2LKmijLyrsunEzS3rDFUxsM6TalcFGlc9qoEyNdPpalnfwwo_lQ49DA",$''']
