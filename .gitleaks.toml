# gitleaks configuration for the CYBRIK Suite meta/control repository.
# Purpose: secret scanning in CI (see .github/workflows/contracts.yml). Pinned gitleaks 8.30.1.
#
# We use the full upstream default ruleset (useDefault = true) unchanged, then add ONE
# narrowly-scoped allowlist to suppress a single, well-understood false positive.
#
# Why the allowlist is safe:
#   - The files under contracts/examples/ are synthetic, curated CONFORMANCE fixtures — the
#     positive/negative test vectors the contract validators run against. Their identifier
#     fields (e.g. "idempotency_key": "idem-8f2c1a90-...") are deliberately constructed, non-
#     secret values. gitleaks' entropy-based `generic-api-key` heuristic matches them because
#     the JSON key contains the substring "key".
#   - The allowlist is scoped by `targetRules = ["generic-api-key"]`, so ONLY that one heuristic
#     rule is relaxed, and only for example JSON. Every high-signal rule (AWS/GCP/Azure keys,
#     private keys, JWTs, provider tokens, etc.) STILL scans these files. A real credential
#     accidentally dropped into an example would still fail CI.
#   - The repository data-handling boundary (CLAUDE.md) independently forbids committing real
#     secrets or customer data anywhere in the suite; this allowlist does not widen that.

title = "CYBRIK Suite secret-scan config"

[extend]
useDefault = true

[[allowlists]]
description = "Synthetic non-secret identifiers in contract conformance fixtures (generic-api-key heuristic only)."
targetRules = ["generic-api-key"]
paths = ['''contracts/examples/.*\.json$''']
